name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            nmap libpango-1.0-0 libpangoft2-1.0-0 \
            libgdk-pixbuf-2.0-0 shared-mime-info libpcap-dev

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install "fastapi>=0.111" "uvicorn[standard]>=0.30" "pydantic>=2.7"
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ -v --cov=docker/tools --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff
        run: pip install ruff>=0.4

      - name: Run ruff
        run: |
          ruff check docker/tools/ tests/ --output-format=github

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: reconengine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
