[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "reconengine"
version = "0.1.0"
description = "Network reconnaissance and vulnerability auditing tool for embedded hardware"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

dependencies = [
    "python-nmap==0.7.1",
    "scapy==2.6.1",
    "weasyprint==68.0",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.3",
    "Pillow==12.1.0",
    "tinycss2==1.5.1",
    "cssselect2==0.8.0",
    "tinyhtml5==2.0.0",
    "pydyf==0.12.1",
    "fonttools==4.61.1",
    "pyphen==0.17.2",
    "webencodings==0.5.1",
    "cffi==2.0.0",
    "pycparser==3.0.0",
    "brotli==1.2.0",
    "zopfli==0.4.0",
    "rich>=13.7.0",
    "matplotlib>=3.8.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",          # for FastAPI TestClient
    "pytest-asyncio>=0.23",
]

[project.scripts]
reconengine = "tools.main:main"
reconengine-api = "tools.api:run"

[tool.setuptools.packages.find]
where = ["docker"]

# ── Ruff (linter + formatter) ──────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default arguments (FastAPI deps)
]

# ── Pytest ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["docker/tools"]
omit = ["*/test_*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70

# ── Mypy ───────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
