services:
  reconengine:
    build:
      context: ..          # repo root — so requirements.txt is in build context
      dockerfile: docker/Dockerfile
    image: reconengine:latest

    # Raw sockets (nmap -sS) and ARP (Scapy) require root + host networking.
    network_mode: host
    privileged: true        # needed for NET_RAW / NET_ADMIN inside container

    environment:
      # Scan profile: quick | full (default: full)
      - RECONENGINE_PROFILE=${RECONENGINE_PROFILE:-full}
      # Comma-separated nmap port list (default: built-in security port set)
      - RECONENGINE_PORTS=${RECONENGINE_PORTS:-}
      # Output directory for PDF reports (relative to /app)
      - RECONENGINE_OUTPUT_DIR=${RECONENGINE_OUTPUT_DIR:-rapports}
      # Parallel scan workers (default: 8)
      - RECONENGINE_MAX_WORKERS=${RECONENGINE_MAX_WORKERS:-8}
      # NVD API key for higher rate limit (50 req/30s vs 5 req/30s without)
      - NVD_API_KEY=${NVD_API_KEY:-}
      # API authentication key for the HTTP server (required in API mode)
      - RECONENGINE_API_KEY=${RECONENGINE_API_KEY:-changeme}
      # Network interface override (default: auto-detect)
      - RECONENGINE_IFACE=${RECONENGINE_IFACE:-}

    volumes:
      # Persist generated PDF reports on the host
      - ${REPORT_OUTPUT_DIR:-./rapports}:/app/rapports

    ports:
      # HTTP API (api.py) — only active when CMD uses api.py
      - "8000:8000"

    restart: unless-stopped
